<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Diagnostic System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>AI Diagnostic System</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="diagnosis.html">Diagnosis</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <section class="login">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p id="error" class="error-message"></p>
    </section>

    <footer>
        <p>&copy; 2024 AI Diagnostic System</p>
    </footer>

    <!-- Inline JavaScript for login functionality -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const loginForm = document.getElementById("loginForm");
            const errorMessage = document.getElementById("error");

            loginForm.addEventListener("submit", function (e) {
                e.preventDefault(); // Prevent the form from submitting normally

                // Example credentials (you can change these)
                const correctUsername = "Manasvi";
                const correctPassword = "170106";

                // Get user input
                const username = document.getElementById("username").value;
                const password = document.getElementById("password").value;

                // Check if the credentials match
                if (username === correctUsername && password === correctPassword) {
                    // Redirect to the diagnosis page
                    window.location.href = "diagnosis.html";
                } else {
                    // Show an error message
                    errorMessage.textContent = "Invalid username or password. Please try again.";
                }
            });
        });
    </script>
</body>
</html>
